<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1411" />
    <title>Adesewa Concept Ltd (ACL) — Agribusiness Management & Ecosystem Connector</title>
    <meta name="description" content="Connecting agribusinesses to capability, capital, markets, and sustainable partnerships. Strategic and operational support for agribusiness growth across Africa." />
    
    <!-- Inline Theme Initializer (Default: Dark, with Grey and Light support) -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('acl_theme') || 'dark';
          document.documentElement.classList.remove('dark', 'grey', 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Fraunces & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans antialiased selection:bg-[#359540]/20 selection:text-[#245240]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
